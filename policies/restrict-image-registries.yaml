apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Only allow images from approved registries
spec:
  # Match Pod only; Kyverno autogen expands the rule to Deployment/StatefulSet/
  # DaemonSet/Job/CronJob automatically.
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        # Enforce everywhere by default (new namespaces are governed automatically);
        # keep platform/system namespaces in Audit — we don't author those pod specs.
        # To graduate a platform namespace to Enforce later, drop it from this list.
        # Note: short image names (e.g. "nginx:1.25") have no registry prefix and
        # are rejected — by design; the goal is fully-qualified registries.
        failureAction: Enforce
        failureActionOverrides:
          - action: Audit
            namespaces:
              - kube-system
              - kube-node-lease
              - kube-public
              - default
              - flux-system
              - kyverno
              - cilium-secrets
              - "cilium-test*"
              - longhorn-system
              - cnpg-system
              - cert-manager
              - sealed-secrets
              - mariadb-operator
              - traefik
              - tailscale
              - monitoring
              - loki
              - alloy
        message: "Images must come from approved registries: ghcr.io, docker.io, quay.io, registry.k8s.io."
        pattern:
          spec:
            containers:
              - image: "ghcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/*"
            =(initContainers):
              - image: "ghcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/*"
            =(ephemeralContainers):
              - image: "ghcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/*"
