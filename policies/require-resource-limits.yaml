apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: All containers must have CPU and memory limits set
spec:
  # Match Pod only; Kyverno autogen expands the rule to Deployment/StatefulSet/
  # DaemonSet/Job/CronJob automatically.
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        # Enforce everywhere by default (new namespaces are governed automatically);
        # keep platform/system namespaces in Audit — we don't author those pod specs.
        # To graduate a platform namespace to Enforce later, drop it from this list.
        failureAction: Enforce
        failureActionOverrides:
          - action: Audit
            namespaces:
              - kube-system
              - kube-node-lease
              - kube-public
              - default
              - flux-system
              - kyverno
              - cilium-secrets
              - "cilium-test*"
              - longhorn-system
              - cnpg-system
              - cert-manager
              - sealed-secrets
              - mariadb-operator
              - traefik
              - tailscale
              - monitoring
              - loki
              - alloy
        message: "All containers must define CPU and memory limits."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
