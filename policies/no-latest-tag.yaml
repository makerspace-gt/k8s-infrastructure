apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Images should use specific tags, not 'latest'
spec:
  # Match Pod only; Kyverno autogen expands the rule to Deployment/StatefulSet/
  # DaemonSet/Job/CronJob automatically.
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        # Audit-first rollout: report violations via PolicyReports, don't block.
        # Flip to Enforce (and add system-namespace excludes) once reports are clean.
        failureAction: Audit
        message: "Images must not use the 'latest' tag. Use a specific version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
            =(ephemeralContainers):
              - image: "!*:latest"
