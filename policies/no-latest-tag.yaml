apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: Images should use specific tags, not 'latest'
spec:
  # Match Pod only; Kyverno autogen expands the rule to Deployment/StatefulSet/
  # DaemonSet/Job/CronJob automatically.
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        # Enforce everywhere by default (new namespaces are governed automatically);
        # keep platform/system namespaces in Audit — we don't author those pod specs.
        # To graduate a platform namespace to Enforce later, drop it from this list.
        failureAction: Enforce
        failureActionOverrides:
          - action: Audit
            namespaces:
              - kube-system
              - kube-node-lease
              - kube-public
              - default
              - flux-system
              - kyverno
              - cilium-secrets
              - "cilium-test*"
              - longhorn-system
              - cnpg-system
              - cert-manager
              - sealed-secrets
              - mariadb-operator
              - traefik
              - tailscale
              - monitoring
              - loki
              - alloy
        message: "Images must not use the 'latest' tag. Use a specific version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
            =(ephemeralContainers):
              - image: "!*:latest"
