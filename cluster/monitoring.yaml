---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: traefik
  path: ./monitoring/kube-prometheus-stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
---
# AlertmanagerConfig + PodMonitor are operator CRs, split from the chart that
# provides their CRDs. dependsOn kube-prometheus-stack (retries until CRDs exist).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: kube-prometheus-stack
  path: ./monitoring/kube-prometheus-stack-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: longhorn
  path: ./monitoring/loki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: loki
  path: ./monitoring/alloy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
