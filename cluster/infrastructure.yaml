apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/controllers/sealed-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
# Flux -> Discord notifications: Provider + Alert on Kustomization/GitRepository
# reconciliation failures. dependsOn sealed-secrets for the webhook secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: sealed-secrets
  path: ./infrastructure/controllers/flux-notifications
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: sealed-secrets
  path: ./infrastructure/certificates/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
# Issuers/Certificates are split from the cert-manager chart: they use CRDs the
# chart provides, so they can't live in the same Kustomization (the CR dry-run
# fails before the chart installs the CRD). dependsOn cert-manager + wait.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: cert-manager
  path: ./infrastructure/certificates/cert-manager-issuers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: traefik
    - name: cert-manager
  path: ./infrastructure/networking/cilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: sealed-secrets
    - name: cert-manager
  path: ./infrastructure/networking/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
# Dashboard exposure (Ingress + Middleware + auth secret). The Middleware is a
# Traefik CR, so it's split from the chart that provides its CRD. dependsOn traefik.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: traefik
  path: ./infrastructure/networking/traefik-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/databases/cloudnative-pg
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/databases/mariadb-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/storage/snapshot-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: snapshot-controller
  path: ./infrastructure/storage/longhorn
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
