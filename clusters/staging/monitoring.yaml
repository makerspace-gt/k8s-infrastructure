---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: traefik
  path: ./monitoring/overlays/staging/kube-prometheus-stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  path: ./monitoring/overlays/staging/loki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-metrics
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: kube-prometheus-stack
  path: ./monitoring/overlays/staging/etcd-metrics
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: loki
  path: ./monitoring/overlays/staging/alloy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
