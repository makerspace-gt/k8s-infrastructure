machine:
  install:
    disk: /dev/sda
  network:
    interfaces:
      - interface: eth0
        dhcp: true
  time:
    servers:
      - time.cloudflare.com
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    nodeIP:
      validSubnets:
        - 192.168.0.0/24
    extraMounts:
      - destination: /var/lib/rook
        type: bind
        source: /var/lib/rook
        options:
          - bind
          - rshared
          - rw
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
  network:
    cni:
      name: none
  proxy:
    disabled: true
