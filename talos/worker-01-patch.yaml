machine:
  install:
    # OS on the 512 GB NVMe, pinned by WWID (stable across reboots / USB shuffling).
    diskSelector:
      wwid: eui.ace42e00053e630c2ee4ac0000000001
    image: factory.talos.dev/metal-installer/cc6abef19f4a24ca6c2fdf9e51fbc66a5c43350670f0660c77a6909d0c0c6479:v1.13.3
  network:
    # The NIC is a USB ethernet adapter, NOT eth0. Its kernel name is USB-bus-path
    # derived (currently enp58s0u1u1u3) and CHANGES when the adapter or port
    # changes (e.g. swapping the temporary dock for the permanent UGREEN). Select
    # the single physical NIC by attribute instead of hardcoding a name.
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    nodeIP:
      validSubnets:
        - 192.168.0.0/24
    # Longhorn data path, backed by the UserVolumeConfig below (single disk).
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
---
# Explicit hostname via the HostnameConfig DOCUMENT — NOT machine.network.hostname
# (conflicts with the gen-default HostnameConfig and aborts the whole apply).
# auto: "off" overrides the default auto: stable that can ghost the node on a
# DHCP outage. Must be a lowercase RFC 1123 label (K8s node name). See docs/setup.md.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: laptopworker01
---
# Single-disk node: the OS and Longhorn share the one 512 GB NVMe. By default the
# EPHEMERAL (/var) volume GROWS TO FILL THE WHOLE DISK, leaving no room for a user
# volume — so cap it. Volume layout is applied ONLY at first provision, so this
# must be correct on the initial install (otherwise: wipe + reinstall). Caps /var
# (container images, logs, ephemeral pod storage) at 100 GiB. See docs/setup.md.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
---
# Longhorn data volume carved from the remaining NVMe space. System volumes
# (EPHEMERAL) provision first; grow:true volumes provision LAST and take whatever
# is left (~400 GiB after EPHEMERAL's cap + system partitions). Pinned to the NVMe
# by WWID. Mounts at /var/mnt/longhorn (matches the kubelet extraMount above and
# Longhorn's defaultDataPath).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.wwid == "eui.ace42e00053e630c2ee4ac0000000001"
  minSize: 50GiB
  grow: true
filesystem:
  type: xfs
