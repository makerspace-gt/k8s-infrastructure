machine:
  install:
    # OS on the 80 GB Intel SSD, pinned by WWID (stable across reboots).
    diskSelector:
      wwid: naa.5001517959454aa6
    # Metal installer schematic incl. iscsi-tools + util-linux-tools (Longhorn),
    # nfs-utils (RWX), intel/amd ucode. Built at factory.talos.dev.
    image: factory.talos.dev/metal-installer/cc6abef19f4a24ca6c2fdf9e51fbc66a5c43350670f0660c77a6909d0c0c6479:v1.13.3
  network:
    interfaces:
      - interface: eth0
        dhcp: true
  time:
    servers:
      - time.cloudflare.com
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    nodeIP:
      validSubnets:
        - 192.168.0.0/24
    # Longhorn data path; backed by the 2 TB array via the UserVolumeConfig
    # document below.
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
  # Keep regular workloads OFF this node — it is the weakest of the three CPs.
  # PreferNoSchedule = soft: the scheduler avoids it but can still place here if
  # towercp02/laptopcp03 cannot fit a pod. Control-plane static pods + DaemonSets
  # tolerate it and keep running. Pair with a one-time rollout/drain to relocate
  # the existing single-node-era pile.
  nodeTaints:
    workload: avoid:PreferNoSchedule
cluster:
  # 3-CP cluster: all control planes also run workloads (no dedicated workers).
  allowSchedulingOnControlPlanes: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
  # kube-controller-manager (:10257) and kube-scheduler (:10259) bind to localhost
  # by default, so the kube-prometheus-stack ServiceMonitors get "connection refused"
  # and fire false TargetDown alerts. Bind on all interfaces so node-IP scrapes work.
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  network:
    cni:
      name: none
  proxy:
    disabled: true
---
# Explicit hostname via the HostnameConfig DOCUMENT — NOT machine.network.hostname,
# which conflicts with the gen-default HostnameConfig ("static hostname is already
# set in v1alpha1 config" + aborts the whole apply). auto: "off" overrides the
# default auto: stable that ghosted the node on a DHCP outage. See docs/setup.md.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: towercp01
---
# Dedicated Longhorn data volume on the 2 TB array (CP only — the laptop has no
# such disk). The aacraid array exposes no WWID/serial, so it's selected by
# transport (the only aacraid disk in the box). Mounts automatically at
# /var/mnt/longhorn — matches Longhorn defaultDataPath and the kubelet extraMount
# above. Added as a second config document via --config-patch-control-plane.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: disk.transport == "aacraid"
  minSize: 100GiB
  grow: true
filesystem:
  type: xfs
