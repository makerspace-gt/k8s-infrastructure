apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # The policies now Enforce on app namespaces (see policies/), so the admission
    # webhook is in the request path: run 2 admission replicas so a single-pod
    # restart doesn't block app-pod admission (default failurePolicy is Fail). The
    # other controllers stay single-replica — if they lag, reports/cleanup are
    # delayed but nothing is blocked.
    admissionController:
      replicas: 2
    backgroundController:
      replicas: 1
    reportsController:
      replicas: 1
    cleanupController:
      replicas: 1
