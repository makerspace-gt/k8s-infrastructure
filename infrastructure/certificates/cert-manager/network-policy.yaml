apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-default-deny
  namespace: cert-manager
spec:
  endpointSelector: {}
  # Coarse "trusted-but-contained" platform policy: allow all in-cluster traffic,
  # deny egress to the internet (world). cert-manager + cainjector + webhook only
  # talk to the apiserver and receive admission webhook calls from it — all
  # in-cluster. The only issuers are the internal CA + selfSigned (no ACME), so
  # cert-manager makes no external calls today → no world egress.
  #
  # NOTE: when ACME / Let's Encrypt is added later (public-exposure roadmap item),
  # this needs an egress hole: `toEntities: [world]` on :443 (ACME directory + the
  # HTTP-01/DNS-01 challenge endpoints). Add it then.
  #
  # The `cluster` entity subsumes DNS, kube-apiserver, host/remote-node, and every
  # namespace, so no separate DNS/apiserver/intra-ns rules are needed.
  ingress:
    - fromEntities:
        - cluster
  egress:
    - toEntities:
        - cluster
