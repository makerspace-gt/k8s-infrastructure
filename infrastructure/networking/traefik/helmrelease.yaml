apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  chart:
    spec:
      chart: traefik
      version: "41.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 12h
  values:
    service:
      type: LoadBalancer
      # Pin Traefik to .202 from the Cilium LB pool (.201–.210). DNS for
      # *.makerspace-gt.de points here. See infrastructure/networking/cilium/lb-ippool.yaml.
      annotations:
        io.cilium/lb-ipam-ips: "192.168.0.202"
    ports:
      web:
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 443
      metrics:
        port: 9100
      traefik:
        port: 8080
        expose:
          default: true
    ingressClass:
      enabled: true
      isDefaultClass: true
    metrics:
      prometheus:
        # Inline ServiceMonitor disabled: the chart hard-fails ("deploy
        # monitoring.coreos.com/v1 first") when the Prometheus operator CRD is
        # absent, but kube-prometheus-stack (which provides it) dependsOn traefik.
        # The /metrics endpoint stays on; re-add a standalone ServiceMonitor via
        # kube-prometheus-stack-config (has the CRD) — see README roadmap.
        serviceMonitor:
          enabled: false
    additionalArguments:
      # secured via middleware basic auth
      - --api.insecure=true
