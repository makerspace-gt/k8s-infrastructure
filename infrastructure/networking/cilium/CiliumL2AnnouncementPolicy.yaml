apiVersion: "cilium.io/v2alpha1"
kind: ciliuml2announcementpolicy
metadata:
  name: default-L2announcement-policy
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  # Talos has eth0
  interfaces:
    - ^eth[0-9]+
  externalIPs: true
  loadBalancerIPs: true
