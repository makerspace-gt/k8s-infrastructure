# LoadBalancer IP pool for the home LAN. Cilium's LB-IPAM hands out an address
# from this range to every Service of type LoadBalancer (Traefik et al). Must sit
# OUTSIDE the router's DHCP range so nothing else claims these IPs.
# Traefik is pinned to .202 via an annotation on its Service (see traefik helmrelease).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: 192.168.0.201
      stop: 192.168.0.210
