apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-backstop
spec:
  description: >-
    Stage 3 defense-in-depth backstop. Any pod NOT in an excluded namespace and
    not otherwise allowed by a namespaced policy is default-deny (ingress+egress),
    with a shared DNS allow so it can still resolve names. All real workload
    namespaces already carry their own enforced policy (Stage 1/2); Cilium policy
    is additive, so this only ADDS a (redundant) DNS allow to them and never
    removes an allow. Real purpose: a namespace created later WITHOUT a policy is
    denied by default instead of open.
  endpointSelector:
    matchExpressions:
      # kube-system   : core networking (CoreDNS, Cilium, ...) — leave open.
      # traefik       : ingress controller, needs world *ingress*; netpol deferred
      #                 to the public-exposure design.
      # cilium-test-* : privileged namespaces pre-created for `cilium connectivity
      #                 test` (see cilium-connectivity-test-namespace.yaml); the
      #                 test manages its own policies and expects a default-allow
      #                 baseline. NOTE: `--test-concurrency >1` creates extra
      #                 suffixed namespaces (cilium-test-2, ...) not excluded here.
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - traefik
          - cilium-test-1
          - cilium-test-ccnp1
          - cilium-test-ccnp2
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    # Shared DNS allow -> kube-dns (CoreDNS) in kube-system.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
