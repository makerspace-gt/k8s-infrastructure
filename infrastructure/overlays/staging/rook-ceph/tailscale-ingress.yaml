apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceph-dashboard-tailscale
  namespace: rook-ceph
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - ceph.zebra-alewife.ts.net
  rules:
    - host: ceph.zebra-alewife.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rook-ceph-mgr-dashboard
                port:
                  number: 7000
