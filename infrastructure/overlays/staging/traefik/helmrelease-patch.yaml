apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  values:
    service:
      type: LoadBalancer
    ports:
      traefik:
        port: 8080
        expose:
          default: true
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    additionalArguments:
      # secured via middleware basic auth
      - --api.insecure=true
