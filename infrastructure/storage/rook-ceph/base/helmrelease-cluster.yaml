apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 30m
  install:
    timeout: 15m
  upgrade:
    timeout: 15m
  dependsOn:
    - name: rook-ceph-operator
  chart:
    spec:
      chart: rook-ceph-cluster
      version: "v1.20.0"
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
      interval: 12h
  values:
    cephClusterSpec:
      mon:
        count: 3
      mgr:
        count: 1
      storage:
        useAllNodes: true
        useAllDevices: true
      placement:
        all:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
      resources:
        mon:
          requests:
            cpu: "500m"
            memory: "512Mi"
        osd:
          requests:
            cpu: "500m"
            memory: "2Gi"
        mgr:
          requests:
            cpu: "200m"
            memory: "256Mi"
        crashcollector:
          requests:
            cpu: "10m"
            memory: "60Mi"
        exporter:
          requests:
            cpu: "10m"
            memory: "50Mi"
        logcollector:
          requests:
            cpu: "10m"
            memory: "100Mi"

    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 2
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4

    cephBlockPoolsVolumeSnapshotClass:
      enabled: false

    cephFileSystems: []
    cephObjectStores: []
