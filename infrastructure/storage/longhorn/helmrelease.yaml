apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 12h
  values:
    # Talos: Longhorn can't auto-detect the kubelet root dir (its detection reads
    # the kubelet cmdline via the kubelet API, which is fragile here), so set it
    # explicitly — otherwise longhorn-driver-deployer crashloops on startup.
    csi:
      kubeletRootDir: /var/lib/kubelet
    # Data lives on the dedicated 2 TB array, mounted by Talos UserVolumeConfig
    # at /var/mnt/longhorn (see talos/controlplane-patch.yaml).
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      # 3-node cluster: one replica per node for full HA. NEW volumes only — existing
      # volumes keep their replica count until raised per-volume (UI / spec.numberOfReplicas).
      defaultReplicaCount: 3
      # Auto-roll volume engines to the default image after a manager upgrade.
      # Without this, engines silently lag the manager.
      # N = concurrent engine upgrades per node.
      concurrentAutomaticEngineUpgradePerNodeLimit: 3
    persistence:
      # Make Longhorn the cluster-wide default StorageClass (replaces ceph-block).
      defaultClass: true
      defaultClassReplicaCount: 3
