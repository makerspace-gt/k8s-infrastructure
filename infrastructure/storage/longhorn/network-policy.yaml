apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-default-deny
  namespace: longhorn-system
spec:
  endpointSelector: {}
  # Coarse "trusted-but-contained" platform policy: allow all in-cluster traffic,
  # deny egress to the internet (world). Longhorn is distributed block storage — all
  # of its traffic is in-cluster: manager <-> instance-manager <-> engine/replica,
  # the CSI plugin/attacher/provisioner, the UI, and Prometheus scraping metrics.
  #
  # The only component that touched world was the upgrade checker (phone-home version
  # check + usage telemetry); it's disabled in helmrelease.yaml, so no world hole here.
  #
  # NOTE: backups are not configured yet (backup-target is empty). When that lands:
  #   - S3 / Azure / GCS backup target  -> add an egress hole: `toEntities: [world]` on :443
  #   - in-cluster MinIO / NFS target   -> already covered by `cluster` (no change)
  #
  # The `cluster` entity subsumes DNS, kube-apiserver, host/remote-node, and every
  # namespace, so no separate DNS/apiserver/intra-ns rules are needed.
  ingress:
    - fromEntities:
        - cluster
  egress:
    - toEntities:
        - cluster
