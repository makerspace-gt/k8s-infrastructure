apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  interval: 30m
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  chart:
    spec:
      chart: snapshot-controller
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: snapshot-controller
      interval: 12h
