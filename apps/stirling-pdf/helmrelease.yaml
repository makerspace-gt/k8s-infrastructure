apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 30m
  chart:
    spec:
      chart: stirling-pdf-chart
      version: "2.2.0"
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
      interval: 12h
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1500Mi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: cluster-ca-issuer
      hosts:
        - name: pdf.makerspace.local
          tls: true
          tlsSecret: stirling-pdf-tls
    probes:
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 10
        failureThreshold: 6
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 6
