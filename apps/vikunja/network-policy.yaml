apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vikunja-ingress
  namespace: vikunja
spec:
  endpointSelector: {}
  ingress:
    # Allow all intra-namespace traffic (vikunja <-> cnpg db)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vikunja
    # Allow Prometheus to scrape metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
    # Allow the CloudNativePG operator to reach the DB instance manager (status
    # extraction on :8000) — without this the Cluster shows "Instance Status
    # Extraction Error: HTTP communication issue" and failover/rolling updates break.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
    # Allow the Tailscale Ingress proxy (tailscale namespace) to reach the app
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "3456"
              protocol: TCP
  # Adding an egress block turns this into default-deny egress for all pods in the
  # namespace. The rules below are the complete set observed via Hubble (app pod ->
  # DB + DNS; CNPG db pod -> kube-apiserver + DNS). No external/world egress exists.
  egress:
    # DNS resolution — every pod needs this
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Intra-namespace (vikunja app -> cnpg db on 5432, plus any db<->db)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vikunja
    # CloudNativePG instance manager -> apiserver (failover/reconciliation). Both
    # entities are needed: remote control-plane apiserver IPs resolve to the
    # kube-apiserver entity, but when the kubernetes Service routes the connection to
    # the apiserver on the pod's OWN node, Cilium classifies it as the host entity.
    - toEntities:
        - kube-apiserver
        - host
