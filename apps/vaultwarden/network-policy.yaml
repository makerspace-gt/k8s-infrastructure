apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vaultwarden-ingress
  namespace: vaultwarden
spec:
  endpointSelector:
    matchLabels:
      app: vaultwarden
  ingress:
    # Allow the Tailscale Ingress proxy (tailscale namespace) to reach the app
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  # Default-deny egress. With DISABLE_ICON_DOWNLOAD=true vaultwarden makes no
  # outbound calls (SQLite-backed; no DB, SMTP, push, or HIBP), so DNS is the only
  # allow — kept as a defensive baseline even though it's rarely used.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
