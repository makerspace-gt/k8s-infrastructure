apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  values:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: netbox.staging.local
          paths:
            - /

    housekeeping:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    worker:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: netbox
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /login/
                    port: http
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 10
