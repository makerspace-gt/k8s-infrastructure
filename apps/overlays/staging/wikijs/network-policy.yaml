apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wikijs-ingress
  namespace: wikijs
spec:
  endpointSelector: {}
  ingress:
    # Allow all intra-namespace traffic (wikijs <-> cnpg db)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wikijs
    # Allow Traefik to reach the wikijs pod
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            k8s:app.kubernetes.io/name: traefik
