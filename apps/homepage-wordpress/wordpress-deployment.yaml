apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: homepage-wordpress
  labels:
    app: wordpress
spec:
  selector:
    matchLabels:
      app: wordpress
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - image: docker.io/library/wordpress:7.0.4-apache
          name: wordpress
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe: # grace for first-boot file copy (~150s max)
            httpGet: { path: /wp-login.php, port: 80 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            periodSeconds: 15
            failureThreshold: 3
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb-database
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db-credentials
                  key: password
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME',
                'https://homepage.zebra-alewife.ts.net');
                    define('WP_SITEURL',
                'https://homepage.zebra-alewife.ts.net');
                    if (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') ===
                'https') {
                        $_SERVER['HTTPS'] = 'on';
                    }
          ports:
            - containerPort: 80
              name: wordpress
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: wordpress-data
