apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wikijs-ingress
  namespace: wikijs
spec:
  endpointSelector: {}
  ingress:
    # Allow all intra-namespace traffic (wikijs <-> cnpg db)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wikijs
    # Allow Prometheus to scrape metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
    # Allow the CloudNativePG operator to reach the DB instance manager (status
    # extraction on :8000) — without this the Cluster shows "Instance Status
    # Extraction Error: HTTP communication issue" and failover/rolling updates break.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
    # Allow the Tailscale Ingress proxy (tailscale namespace) to reach the app
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  # Adding an egress block turns this into default-deny egress for all pods in the
  # namespace. Observed via Hubble: app -> DB (intra-ns) + DNS; CNPG db pod -> apiserver.
  # No external/world egress.
  egress:
    # DNS resolution — every pod needs this
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Intra-namespace (wikijs app -> cnpg db on 5432, plus any db<->db)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wikijs
    # CloudNativePG instance manager -> apiserver. Both entities are needed: remote
    # control-plane apiserver IPs resolve to the kube-apiserver entity, but when the
    # kubernetes Service routes to the apiserver on the pod's OWN node, Cilium
    # classifies it as the host entity.
    - toEntities:
        - kube-apiserver
        - host
