apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 30m
  chart:
    spec:
      chart: netbox
      version: "7.4.16"
      sourceRef:
        kind: HelmRepository
        name: netbox-community
      interval: 12h
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    postgresql:
      enabled: false
    externalDatabase:
      host: netbox-db-rw
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db-app
      existingSecretKey: password
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: cluster-ca-issuer
      hosts:
        - host: netbox.makerspace.local
          paths:
            - /
      tls:
        - hosts:
            - netbox.makerspace.local
          secretName: netbox-tls
    housekeeping:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    worker:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: netbox
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /login/
                    port: http
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 10
