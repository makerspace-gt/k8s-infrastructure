apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 30m
  chart:
    spec:
      chart: netbox
      version: "8.3.20"
      sourceRef:
        kind: HelmRepository
        name: netbox-community
      interval: 12h
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    allowedHosts:
      - netbox.zebra-alewife.ts.net
    persistence:
      accessMode: ReadWriteMany
    postgresql:
      enabled: false
    externalDatabase:
      host: netbox-db-rw
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db-app
      existingSecretKey: password
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    housekeeping:
      # Disabled: NetBox's built-in scheduler (rqworker) handles housekeeping, and
      # the command itself prints that this CronJob is redundant + to be removed. It
      # only existed to occasionally fail and pin KubeJobFailed in Discord.
      enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    worker:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: netbox
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /login/
                    port: http
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 10
