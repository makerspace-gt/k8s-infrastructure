apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-db
  namespace: netbox
spec:
  instances: 2
  storage:
    size: 10Gi
  # Required by Kyverno require-resource-limits (Enforce on app namespaces): without
  # limits the postgres pod is denied admission, which blocked the second instance
  # from ever being created (cluster stuck at 1/2, "Waiting for the instances to
  # become active") and would block the primary too on any recreation. Higher memory
  # limit than the wikis — netbox's Django schema/queries are heavier.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  bootstrap:
    initdb:
      database: netbox
      owner: netbox
