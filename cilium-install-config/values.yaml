# Cilium needs these to run
kubeProxyReplacement: true
ipam:
  mode: kubernetes

# LAN reachability for LoadBalancer Services. l2announcements makes Cilium answer
# ARP for LB-IPAM IPs (see infrastructure/networking/cilium/{lb-ippool,l2-announcement-policy}.yaml);
# externalIPs handles Services with an externalIPs field. L2 announcements renew
# leader-election leases frequently, so bump the k8s client rate limit per Cilium docs.
l2announcements:
  enabled: true
externalIPs:
  enabled: true
k8sClientRateLimit:
  qps: 10
  burst: 20
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

encryption:
  enabled: true
  type: wireguard

# Have Cilium use Talos KubePrism-announced API IP
k8sServiceHost: localhost
k8sServicePort: 7445

hubble:
  relay:
    enabled: true
  ui:
    enabled:
      true
