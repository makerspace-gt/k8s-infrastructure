# Level-triggered stall detector across all Flux resources (every Kustomization,
# HelmRelease, GitRepository, HelmRepository, HelmChart). Readiness comes from
# kube-state-metrics Custom Resource State (gotk_resource_info), configured in the
# kube-prometheus-stack HelmRelease values — newer Flux controllers no longer emit
# gotk_reconcile_condition. Routes to Discord via the warning severity (Alertmanager
# only forwards warning|critical).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-reconciliation
  namespace: monitoring
  labels:
    # The operator's ruleSelector matches on the release label by default.
    release: kube-prometheus-stack
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxReconciliationFailure
          # ready!="True" (not just ="False") so it also catches resources wedged in
          # Unknown/Progressing — the exact state the sealed-secrets stall sat in for
          # days. suspended!="true" excludes intentionally suspended resources. All the
          # configured kinds always carry a Ready condition, so this never matches an
          # empty-ready series. 30m avoids flapping on normal multi-minute reconciles.
          expr: gotk_resource_info{ready!="True", suspended!="true"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} not ready >30m"
            description: >-
              {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has had Ready!=True for over 30 minutes — reconciliation is stuck.
              Investigate with: flux get {{ $labels.customresource_kind | toLower }} -A
