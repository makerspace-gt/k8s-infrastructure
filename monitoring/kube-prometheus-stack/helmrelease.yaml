apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.2.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 12h
  install:
    crds: Create
    timeout: 10m
  upgrade:
    crds: CreateReplace
    timeout: 10m
  values:
    # No kube-proxy runs (Talos proxy.disabled + Cilium kubeProxyReplacement),
    # so drop its scrape job + KubeProxyDown rule — both fire false otherwise.
    kubeProxy:
      enabled: false
    # Talos etcd runs OUTSIDE Kubernetes (not a pod), so the default selector
    # service (component=etcd) gets empty Endpoints from the endpoint-controller
    # and scrapes nothing. Providing `endpoints` makes the chart render a
    # selector-LESS Service + a static Endpoints with these IPs, which nothing
    # clobbers. Metrics are on :2381 (cluster.etcd listen-metrics-urls in the CP
    # patch). Replaces the old manual etcd-endpoints.yaml Kustomization.
    kubeEtcd:
      enabled: true
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      endpoints:
        - 192.168.0.68   # towercp01
        - 192.168.0.157  # towercp02
        - 192.168.0.21   # laptopcp03
    defaultRules:
      # The kube-apiserver SLO rules compute increase() over 30d and burn-rate over 3d
      # across the high-cardinality apiserver_request histogram — they time out evaluating
      # on this cluster (PrometheusRuleFailures / PrometheusMissingRuleEvaluations). They
      # power apiserver SLO dashboards/alerts that a single-tenant homelab doesn't use, so
      # disable the whole groups (not Prometheus CPU-starved — confirmed ~0.12/0.5 cores).
      rules:
        kubeApiserverSlos: false
        kubeApiserverBurnrate: false
        kubeApiserverAvailability: false
        kubeApiserverHistogram: false
      disabled:
        # Noisy in a homelab: fires whenever a container with a low CPU limit
        # gets throttled, which is constant and not actionable here.
        CPUThrottlingHigh: true
    prometheus:
      prometheusSpec:
        retention: 14d
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: cluster-ca-issuer
        hosts:
          - grafana.makerspace.local
        tls:
          - hosts:
              - grafana.makerspace.local
            secretName: grafana-tls
      additionalDataSources:
        - name: Loki
          type: loki
          isDefault: false
          # Gateway service is loki-gateway on port 80
          url: http://loki-gateway.loki.svc.cluster.local
          jsonData:
            maxLines: 1000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: enabled
        alertmanagerConfigNamespaceSelector: {}
        alertmanagerConfigMatcherStrategy:
          type: None
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: "null"
          routes:
            - match:
                alertname: Watchdog
              receiver: "null"
        receivers:
          - name: "null"
    # Newer Flux controllers no longer emit gotk_reconcile_condition, so resource
    # readiness is exposed via kube-state-metrics Custom Resource State instead, as
    # gotk_resource_info{ready=...,suspended=...} (config mirrors
    # fluxcd/flux2-monitoring-example, trimmed to the CRDs installed here). The
    # flux-reconciliation PrometheusRule alerts on ready="False". RBAC lets KSM
    # list/watch the Flux CRDs.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
            resources: ["*"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
