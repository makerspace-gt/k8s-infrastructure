name: Validate Manifests

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML syntax
        run: |
          find . '(' -name '*.yaml' -o -name '*.yml' ')' -not -path './talos/*' -not -path '*/flux-system/*' | while read file; do
            echo "Checking $file"
            yamllint "$file" || exit 1
          done

  kubernetes-validation:
    name: Kubernetes Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Setup kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Setup kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      # Runs the exact same checks as the local pre-commit hook (scripts/validate.sh):
      # kustomize build -> kubeconform per kustomization, then kyverno policy pre-flight.
      - name: Validate manifests
        run: ./scripts/validate.sh
