# See https://pre-commit.com for more information
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(talos/|cluster/flux-system/)
      - id: end-of-file-fixer
        exclude: ^(talos/|cluster/flux-system/)
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(talos/secrets\.yaml|\.sealed-secrets-pub\.pem)

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        exclude: ^(talos/|cluster/flux-system/)
        args: ["-c", ".yamllint"]

  # Manifest validation: kustomize build -> kubeconform + kyverno policy
  # pre-flight, via the same script CI runs (scripts/validate.sh), so local and
  # CI never drift. Builds whole kustomizations, so it runs on the full repo
  # rather than per-file. Requires kustomize, kubeconform, kyverno on PATH.
  - repo: local
    hooks:
      - id: validate-manifests
        name: Validate Kubernetes manifests (kustomize/kubeconform/kyverno)
        entry: scripts/validate.sh
        language: system
        pass_filenames: false
        always_run: true
